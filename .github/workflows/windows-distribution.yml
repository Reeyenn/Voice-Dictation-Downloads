name: Windows distribution validation

on:
  workflow_dispatch:
    inputs:
      version: { description: "Release version", required: true, default: 0.9.0, type: string }
      bootstrap_release_tag: { description: "Draft bootstrap-v<version> tag", required: true, default: bootstrap-v0.9.0, type: string }
      x64_portable_sha256: { description: "x64 portable SHA-256", required: true, type: string }
      arm64_portable_sha256: { description: "ARM64 portable SHA-256", required: true, type: string }
      x64_platform_tests_sha256: { description: "x64 Platform.Tests SHA-256", required: true, type: string }
      arm64_platform_tests_sha256: { description: "ARM64 Platform.Tests SHA-256", required: true, type: string }

permissions:
  contents: write
concurrency:
  group: windows-distribution-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  package-x64:
    name: Package universal candidate
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { persist-credentials: false }
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with: { dotnet-version: 10.0.400 }
      - name: Verify native x64 host and exact SDK
        shell: pwsh
        run: |
          if ([Runtime.InteropServices.RuntimeInformation]::OSArchitecture -ne 'X64' -or [Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture -ne 'X64') { throw 'The packaging job must run natively on x64.' }
          if ((dotnet --version).Trim() -cne '10.0.400') { throw 'Expected .NET SDK 10.0.400.' }
      - name: Install pinned Inno Setup
        shell: pwsh
        env:
          INNO_URL: https://github.com/jrsoftware/issrc/releases/download/is-6_7_1/innosetup-6.7.1.exe
          INNO_SHA256: 4d11e8050b6185e0d49bd9e8cc661a7a59f44959a621d31d11033124c4e8a7b0
          INNO_SIZE: 10619024
        run: |
          $download = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.1.exe'
          Invoke-WebRequest -Uri $env:INNO_URL -OutFile $download
          if ((Get-Item $download).Length -ne [int64]$env:INNO_SIZE) { throw 'Inno Setup size mismatch.' }
          if ((Get-FileHash $download -Algorithm SHA256).Hash.ToLowerInvariant() -cne $env:INNO_SHA256) { throw 'Inno Setup hash mismatch.' }
          $signature = Get-AuthenticodeSignature $download
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Pyrsys B\.V\.') { throw 'Inno Setup signature mismatch.' }
          $destination = Join-Path $env:RUNNER_TEMP 'inno-6.7.1'
          $process = Start-Process $download -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',("/DIR=`"$destination`"") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Inno Setup install failed with $($process.ExitCode)." }
          $destination | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Verify static contracts
        shell: pwsh
        run: |
          ./scripts/Test-DistributionPins.ps1
          ./scripts/Test-ReleaseSelection.ps1
      - name: Build universal candidate and validate x64
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ inputs.bootstrap_release_tag }}
          X64_PORTABLE_SHA: ${{ inputs.x64_portable_sha256 }}
          ARM64_PORTABLE_SHA: ${{ inputs.arm64_portable_sha256 }}
          X64_TESTS_SHA: ${{ inputs.x64_platform_tests_sha256 }}
        run: |
          ./scripts/Validate-Distribution.ps1 -Mode Package -Architecture x64 -MinimumWindowsBuild 19045 -Version $env:VERSION `
            -PortableAssetName "Voice-Dictation-Windows-x64-$env:VERSION-Portable.zip" -PortableSha256 $env:X64_PORTABLE_SHA `
            -Arm64PortableAssetName "Voice-Dictation-Windows-arm64-$env:VERSION-Portable.zip" -Arm64PortableSha256 $env:ARM64_PORTABLE_SHA `
            -PlatformTestsAssetName "Voice-Dictation-Windows-x64-$env:VERSION-Platform.Tests.zip" -PlatformTestsSha256 $env:X64_TESTS_SHA `
            -Repository $env:GITHUB_REPOSITORY -ReleaseTag $env:RELEASE_TAG
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-${{ inputs.version }}-candidate
          path: |
            artifacts/Voice-Dictation-Windows-${{ inputs.version }}-Setup.exe
            artifacts/Voice-Dictation-Windows-x64-${{ inputs.version }}-Portable.zip
            artifacts/Voice-Dictation-Windows-arm64-${{ inputs.version }}-Portable.zip
            artifacts/SHA256SUMS.json
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 2

  validate-x64:
    name: Validate same candidate on native Windows x64
    needs: package-x64
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { persist-credentials: false }
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with: { dotnet-version: 10.0.400 }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: { name: "windows-${{ inputs.version }}-candidate", path: candidate }
      - name: Validate native x64 tests, install, self-test, and inference
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ inputs.bootstrap_release_tag }}
          X64_PORTABLE_SHA: ${{ inputs.x64_portable_sha256 }}
          X64_TESTS_SHA: ${{ inputs.x64_platform_tests_sha256 }}
        run: |
          if ([Runtime.InteropServices.RuntimeInformation]::OSArchitecture -ne 'X64' -or [Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture -ne 'X64') { throw 'This job must run natively on x64.' }
          if ((dotnet --version).Trim() -cne '10.0.400') { throw 'Expected .NET SDK 10.0.400.' }
          ./scripts/Validate-Distribution.ps1 -Mode Native -Architecture x64 -MinimumWindowsBuild 19045 -Version $env:VERSION -CandidateRoot ./candidate `
            -PortableSha256 $env:X64_PORTABLE_SHA `
            -PlatformTestsAssetName "Voice-Dictation-Windows-x64-$env:VERSION-Platform.Tests.zip" -PlatformTestsSha256 $env:X64_TESTS_SHA `
            -Repository $env:GITHUB_REPOSITORY -ReleaseTag $env:RELEASE_TAG

  validate-arm64:
    name: Validate same candidate on native Windows 11 ARM64
    needs: package-x64
    runs-on: windows-11-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { persist-credentials: false }
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with: { dotnet-version: 10.0.400 }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: { name: "windows-${{ inputs.version }}-candidate", path: candidate }
      - name: Validate native ARM64 tests, install, self-test, and inference
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ inputs.bootstrap_release_tag }}
          ARM64_PORTABLE_SHA: ${{ inputs.arm64_portable_sha256 }}
          ARM64_TESTS_SHA: ${{ inputs.arm64_platform_tests_sha256 }}
        run: |
          if ([Runtime.InteropServices.RuntimeInformation]::OSArchitecture -ne 'Arm64' -or [Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture -ne 'Arm64') { throw 'This job must run natively on ARM64.' }
          ./scripts/Validate-Distribution.ps1 -Mode Native -Architecture arm64 -MinimumWindowsBuild 19045 -Version $env:VERSION -CandidateRoot ./candidate `
            -PortableSha256 $env:ARM64_PORTABLE_SHA `
            -PlatformTestsAssetName "Voice-Dictation-Windows-arm64-$env:VERSION-Platform.Tests.zip" -PlatformTestsSha256 $env:ARM64_TESTS_SHA `
            -Repository $env:GITHUB_REPOSITORY -ReleaseTag $env:RELEASE_TAG

  validate-server-2022-x64:
    name: Validate same candidate on native Windows Server 2022 x64
    needs: package-x64
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { persist-credentials: false }
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with: { dotnet-version: 10.0.400 }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: { name: "windows-${{ inputs.version }}-candidate", path: candidate }
      - name: Validate native Server 2022 x64 tests, install, self-test, and inference
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ inputs.bootstrap_release_tag }}
          X64_PORTABLE_SHA: ${{ inputs.x64_portable_sha256 }}
          X64_TESTS_SHA: ${{ inputs.x64_platform_tests_sha256 }}
        run: |
          if ([Runtime.InteropServices.RuntimeInformation]::OSArchitecture -ne 'X64' -or [Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture -ne 'X64') { throw 'This job must run natively on x64.' }
          if ((dotnet --version).Trim() -cne '10.0.400') { throw 'Expected .NET SDK 10.0.400.' }
          ./scripts/Validate-Distribution.ps1 -Mode Native -Architecture x64 -MinimumWindowsBuild 19045 -Version $env:VERSION -CandidateRoot ./candidate `
            -PortableSha256 $env:X64_PORTABLE_SHA `
            -PlatformTestsAssetName "Voice-Dictation-Windows-x64-$env:VERSION-Platform.Tests.zip" -PlatformTestsSha256 $env:X64_TESTS_SHA `
            -Repository $env:GITHUB_REPOSITORY -ReleaseTag $env:RELEASE_TAG

  publish-validated:
    name: Expose only the two-architecture validated candidate
    needs: [package-x64, validate-x64, validate-arm64, validate-server-2022-x64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: { name: "windows-${{ inputs.version }}-candidate", path: candidate }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: voice-dictation-windows-${{ inputs.version }}
          path: |
            candidate/Voice-Dictation-Windows-${{ inputs.version }}-Setup.exe
            candidate/Voice-Dictation-Windows-x64-${{ inputs.version }}-Portable.zip
            candidate/Voice-Dictation-Windows-arm64-${{ inputs.version }}-Portable.zip
            candidate/SHA256SUMS.json
            candidate/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
