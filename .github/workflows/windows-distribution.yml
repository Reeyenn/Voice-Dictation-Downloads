name: Windows distribution validation

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version whose draft or published release contains the bootstrap assets (for example 0.7.0)"
        required: true
        type: string
      bootstrap_release_tag:
        description: "Private draft bootstrap tag; must be bootstrap-v<version>"
        required: true
        default: bootstrap-v0.7.0
        type: string
      portable_asset:
        description: "Exact versioned portable ZIP asset name"
        required: true
        type: string
      portable_sha256:
        description: "Lowercase SHA-256 for the portable ZIP"
        required: true
        type: string
      platform_tests_asset:
        description: "Exact versioned precompiled Platform.Tests ZIP asset name"
        required: false
        type: string
      platform_tests_sha256:
        description: "SHA-256 for Platform.Tests ZIP (required when tests are enabled)"
        required: false
        type: string
      run_platform_tests:
        description: "Run the precompiled Platform.Tests archive (default true)"
        required: false
        default: true
        type: boolean

# The workflow is deliberately manual-only. The only token injected into the
# validation script is this repository's read-only built-in token, used for its
# own release assets; no private-source token or secret is accepted.
permissions:
  contents: read

jobs:
  validate:
    name: Validate and package Windows x64 beta
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      BOOTSTRAP_VERSION: ${{ inputs.version }}
      BOOTSTRAP_RELEASE_TAG: ${{ inputs.bootstrap_release_tag }}
      PORTABLE_ASSET: ${{ inputs.portable_asset }}
      PORTABLE_SHA256: ${{ inputs.portable_sha256 }}
      PLATFORM_TESTS_ASSET: ${{ inputs.platform_tests_asset }}
      PLATFORM_TESTS_SHA256: ${{ inputs.platform_tests_sha256 }}
      RUN_PLATFORM_TESTS: ${{ inputs.run_platform_tests }}

    steps:
      - name: Check out distribution metadata
        # v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up .NET 10 SDK
        # v4.3.1
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.x

      - name: Install pinned Inno Setup package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $innoVersion = '6.7.1'
          choco install innosetup --version $innoVersion --yes --no-progress --limit-output
          if ($LASTEXITCODE -ne 0) { throw "Chocolatey could not install Inno Setup $innoVersion." }
          if ($null -eq (Get-Command iscc.exe -ErrorAction SilentlyContinue)) {
            throw 'Inno Setup compiler is not available after installation.'
          }

      - name: Validate bootstrap assets, run Windows tests, and package
        shell: pwsh
        env:
          # github.token is scoped to this distribution repository and exists
          # only for the release-asset download step; the script clears it
          # before starting any precompiled/test/installer child process.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $runTests = $env:RUN_PLATFORM_TESTS -eq 'true'
          $arguments = @{
            Version = $env:BOOTSTRAP_VERSION
            PortableAssetName = $env:PORTABLE_ASSET
            PortableSha256 = $env:PORTABLE_SHA256
            PlatformTestsAssetName = $env:PLATFORM_TESTS_ASSET
            PlatformTestsSha256 = $env:PLATFORM_TESTS_SHA256
            RunPlatformTests = $runTests
            Repository = $env:GITHUB_REPOSITORY
            ReleaseTag = $env:BOOTSTRAP_RELEASE_TAG
          }
          & ./scripts/Validate-Distribution.ps1 @arguments
          if ($LASTEXITCODE -ne 0) { throw "Distribution validation exited with code $LASTEXITCODE." }

      - name: Upload validated distribution artifact
        # v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: voice-dictation-windows-${{ inputs.version }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
