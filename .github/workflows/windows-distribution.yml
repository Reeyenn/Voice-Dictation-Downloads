name: Windows distribution validation

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version whose draft or published release contains the bootstrap assets (for example 0.7.1)"
        required: true
        type: string
      bootstrap_release_tag:
        description: "Private draft bootstrap tag; must be bootstrap-v<version>"
        required: true
        default: bootstrap-v0.7.1
        type: string
      portable_asset:
        description: "Exact versioned portable ZIP asset name"
        required: true
        type: string
      portable_sha256:
        description: "Lowercase SHA-256 for the portable ZIP"
        required: true
        type: string
      platform_tests_asset:
        description: "Exact versioned precompiled Platform.Tests ZIP asset name"
        required: false
        type: string
      platform_tests_sha256:
        description: "SHA-256 for Platform.Tests ZIP (required when tests are enabled)"
        required: false
        type: string
      run_platform_tests:
        description: "Run the precompiled Platform.Tests archive (default true)"
        required: false
        default: true
        type: boolean

# The workflow is deliberately manual-only. GitHub requires the built-in
# contents:write scope when a workflow reads assets from a same-repository
# draft release; this is the least scope accepted for that draft-release API.
# The token is still limited to this distribution repository, the script only
# performs GET requests, and no private-source token or secret is accepted.
permissions:
  contents: write

jobs:
  validate:
    name: Validate and package Windows x64 beta
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      BOOTSTRAP_VERSION: ${{ inputs.version }}
      BOOTSTRAP_RELEASE_TAG: ${{ inputs.bootstrap_release_tag }}
      PORTABLE_ASSET: ${{ inputs.portable_asset }}
      PORTABLE_SHA256: ${{ inputs.portable_sha256 }}
      PLATFORM_TESTS_ASSET: ${{ inputs.platform_tests_asset }}
      PLATFORM_TESTS_SHA256: ${{ inputs.platform_tests_sha256 }}
      RUN_PLATFORM_TESTS: ${{ inputs.run_platform_tests }}

    steps:
      - name: Check out distribution metadata
        # v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up .NET 10 SDK
        # v4.3.1
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.400

      - name: Verify exact .NET SDK
        shell: pwsh
        run: |
          $actual = (dotnet --version).Trim()
          if ($actual -cne '10.0.400') { throw "Expected .NET SDK 10.0.400, found $actual." }

      - name: Install pinned Inno Setup
        shell: pwsh
        env:
          INNO_URL: https://github.com/jrsoftware/issrc/releases/download/is-6_7_1/innosetup-6.7.1.exe
          INNO_SHA256: 4d11e8050b6185e0d49bd9e8cc661a7a59f44959a621d31d11033124c4e8a7b0
          INNO_SIZE: 10619024
        run: |
          $ErrorActionPreference = 'Stop'
          $downloadPath = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.1.exe'
          Invoke-WebRequest -Uri $env:INNO_URL -OutFile $downloadPath
          $item = Get-Item -LiteralPath $downloadPath
          if ($item.Length -ne [int64]$env:INNO_SIZE) { throw "Inno Setup installer is $($item.Length) bytes; expected $env:INNO_SIZE." }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $downloadPath).Hash.ToLowerInvariant()
          if ($hash -cne $env:INNO_SHA256) { throw "Inno Setup installer SHA-256 is $hash; expected $env:INNO_SHA256." }
          $signature = Get-AuthenticodeSignature -FilePath $downloadPath
          if ($signature.Status -ne 'Valid' -or $null -eq $signature.SignerCertificate -or
              ($signature.SignerCertificate.Subject -notmatch 'Pyrsys B\.V\.' -and $signature.SignerCertificate.Issuer -notmatch 'Pyrsys B\.V\.')) {
            throw 'Inno Setup installer did not pass Pyrsys B.V. Authenticode verification.'
          }
          $installDir = Join-Path $env:RUNNER_TEMP 'inno-6.7.1'
          if (Test-Path -LiteralPath $installDir) { Remove-Item -LiteralPath $installDir -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $installDir | Out-Null
          $process = Start-Process -FilePath $downloadPath -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', ("/DIR=`"$installDir`"") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Inno Setup installer exited with $($process.ExitCode)." }
          $iscc = Join-Path $installDir 'ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc -PathType Leaf)) { throw 'Pinned Inno Setup install did not produce ISCC.exe.' }
          # This compiler intentionally exposes 0.0.0.0 in both PE version
          # string fields. The actual installer script therefore validates
          # ISPP's authoritative PREPROCVER value when ISCC compiles it.
          Split-Path -Parent $iscc | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify distribution pins and provenance gates
        shell: pwsh
        run: ./scripts/Test-DistributionPins.ps1

      - name: Verify exact release selection regression
        shell: pwsh
        run: ./scripts/Test-ReleaseSelection.ps1

      - name: Validate bootstrap assets, run Windows tests, and package
        shell: pwsh
        env:
          # github.token is scoped to this distribution repository. It is used
          # only for same-repository draft/release asset GETs; the script clears
          # GH_TOKEN and GITHUB_TOKEN before starting any precompiled app,
          # test, compiler, or installer child process.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          # Validate-Distribution.ps1 enables VOICE_DICTATION_UIA_FIXTURE only
          # around the hosted Windows Platform.Tests process.
          $runTests = $env:RUN_PLATFORM_TESTS -eq 'true'
          $arguments = @{
            Version = $env:BOOTSTRAP_VERSION
            PortableAssetName = $env:PORTABLE_ASSET
            PortableSha256 = $env:PORTABLE_SHA256
            PlatformTestsAssetName = $env:PLATFORM_TESTS_ASSET
            PlatformTestsSha256 = $env:PLATFORM_TESTS_SHA256
            RunPlatformTests = $runTests
            Repository = $env:GITHUB_REPOSITORY
            ReleaseTag = $env:BOOTSTRAP_RELEASE_TAG
          }
          & ./scripts/Validate-Distribution.ps1 @arguments
          if ($LASTEXITCODE -ne 0) { throw "Distribution validation exited with code $LASTEXITCODE." }

      - name: Upload validated distribution artifact
        # v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: voice-dictation-windows-${{ inputs.version }}
          path: |
            artifacts/Voice-Dictation-Windows-x64-${{ inputs.version }}-Setup.exe
            artifacts/Voice-Dictation-Windows-x64-${{ inputs.version }}-Portable.zip
            artifacts/SHA256SUMS.json
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
